name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package
        run: |
          mkdir -p dist/ClaudeUsageWidget
          cp -r ClaudeUsageWidget.ps1 ClaudeUsageWidget.vbs src LICENSE README.md dist/ClaudeUsageWidget/
          cd dist && zip -r ClaudeUsageWidget.zip ClaudeUsageWidget

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/ClaudeUsageWidget.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
